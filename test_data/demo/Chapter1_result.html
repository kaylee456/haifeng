<h1>1 工程概况</h1>
<p>本工程位于山东省某海域，项目建设规模为500MW海上风电场。工程包含风机基础施工、海缆敷设、升压站建设等主要工程内容。</p>
<h2>1.1 工程位置及范围</h2>
<p>风电场场址位于渤海南部海域，中心离岸距离约35km，水深范围8~15m。场区面积约120km²，规划安装100台单机容量5MW的风力发电机组。</p>
<h2>1.2 工程规模</h2>
<p>本项目总装机容量500MW，年上网电量约15亿kWh，等效满负荷利用小时数约3000h。工程总投资约80亿元。</p>
