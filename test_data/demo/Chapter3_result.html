<h1>3 施工总体部署</h1>
<p>根据工程特点和施工条件，对施工总体部署进行规划，确定施工顺序和组织方案。</p>
<h2>3.1 施工组织机构</h2>
<p>项目设立项目经理部，下设工程技术部、质量安全部、物资设备部、综合管理部等部门。配备项目经理1名、总工程师1名、各部门负责人若干。</p>
<h2>3.2 施工总进度计划</h2>
<p>工程总工期24个月。其中准备期3个月，主体施工期18个月，收尾期3个月。关键线路为：基础施工 → 风机安装 → 海缆敷设 → 调试并网。</p>
